    "body": "<h2 align=\"justify\" style=\"\">Bài 56: Sâu cuốn lá nhỏ</h2><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">(Cnaphalocrosis medinalis Guenee)</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">(Tên khoa học: Cnaphalocrosis medinalí Guenee)</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">Thuộc: Họ: Pyralidae Bộ: Lepidoptera</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho02.jpg\" width=\"152\" height=\"159\" align=\"left\">Đặc điểm hình thái:</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">- Trứng hình bầu dục, có vân mạng lưới rất nhỏ, đẻ cả ở mặt trên và mặt dưới lá (nhưng chủ yếu ở mặt trên lá). Trứng mới đẻ màu hơi đục, khi gần nở chuyển màu ngà vàng.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">- Sâu non tuổi 1 đã rất linh hoạt; tuổi 2-3 trở đi nhả tơ khâu hai mép lá cuốn thành tổ nằm bên trong gây hại; tuổi 4-5 nhả tơ dệt gập lá theo chiều ngang hoặc chập nhiều lá thành bao. Sâu non mới nở màu trắng trong, đầu màu nâu sáng, khi bắt đầu ăn cơ thể chuyển màu xanh lá mạ. Sâu non đẫy sức chuyển màu vàng hồng chui ra khỏi bao tìm chỗ hoá nhộng theo cách nhả tơ, cắn đứt hai mép lá khâu thành bao hoặc bò xuống gốc lúa, bẹ lá dệt kén mỏng hoá nhộng.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">- Nhộng: có mầm cánh, râu đầu và chân vượt quá mép sau đốt bụng thứ 4. Lỗ thở trồi lên, các đốt bụng thứ 6, 8 thót vào.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">- Con trưởng thành: có màu vàng nâu, mép trước cánh trước màu nâu đen. Ở khoảng 2/3 kể từ gốc cánh con đực có chấm lõm màu đen óng ánh, trên chấm có chùm lông màu nâu xẫm.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">Đặc điểm sinh học, sinh thái và gây hại:</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">Vòng đời của sâu cuốn lá nhỏ từ 30-35 ngày:</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">+ Thời gian trứng: 6-7 ngày.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">+ Thời gian sâu non: 15-25 ngày.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">+ Thời gian nhộng: 6-8 ngày.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">+ Thời gian ngài vũ hóa đến đẻ trứng: 2-7 ngày.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">Ngài của sâu cuốn lá nhỏ có tính hướng quang rất mạnh và con cái mạnh hơn con đực. Nhộng thường vũ hóa về đêm, ban ngày thường ẩn nấp, nếu khua động thì chỉ bay lên bằng chiều cao ngọn</p><p style=\"padding-left: 5px; padding-right: 5px; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho03.jpg\" width=\"77\" height=\"340\"><br>Nhộng</p><p style=\"padding-left: 5px; padding-right: 5px; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho01.jpg\" width=\"277\" height=\"265\"><br>Bướm sâu cuốn lá nhỏ</p><p style=\"padding-left: 5px; padding-right: 5px; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho04.jpg\" width=\"257\" height=\"370\">&nbsp;&nbsp;&nbsp;<img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho05.jpg\" width=\"71\" height=\"100\"><br>Lá lúa bị sâu cuốn lá nhỏ phá hoại</p><p style=\"padding-left: 5px; padding-right: 5px; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho06.jpg\" width=\"327\" height=\"205\"><br>Ruộng lúa bị sâu cuốn lá nhỏ</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">Phòng trừ bằng cách:</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">● Bón cân đối NPK, không nên bón quá nhiều đạm.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">● Điều chỉnh mật độ cấy hợp lý, vệ sinh đồng ruộng và diệt trừ cỏ dại là nơi trú ngụ qua đông.</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">● Dùng các biện pháp thủ công: bẫy đèn bắt bướm…</p><p align=\"justify\" style=\"padding-left: 5px; padding-right: 5px;\">● Diệt trừ bằng thuốc hoá học: phun các loại thuốc: Padan 95SP, Gegent 800WP, Sumithion 50 EC, Karte 2,EC…</p>"

    "body": "<h2 align=\"justify\" style=\"color: rgb(156, 0, 0); font-size: 14pt; font-family: Arial;\">Sâu cuốn lá nhỏ</h2><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\"><b>(Cnaphalocrosis medinalis Guenee)</b></p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">(Tên khoa học: Cnaphalocrosis medinalí Guenee)</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">Thuộc: Họ: Pyralidae Bộ: Lepidoptera</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho02.jpg\" width=\"152\" height=\"159\" align=\"left\">Đặc điểm hình thái:</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">- Trứng hình bầu dục, có vân mạng lưới rất nhỏ, đẻ cả ở mặt trên và mặt dưới lá (nhưng chủ yếu ở mặt trên lá). Trứng mới đẻ màu hơi đục, khi gần nở chuyển màu ngà vàng.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">- Sâu non tuổi 1 đã rất linh hoạt; tuổi 2-3 trở đi nhả tơ khâu hai mép lá cuốn thành tổ nằm bên trong gây hại; tuổi 4-5 nhả tơ dệt gập lá theo chiều ngang hoặc chập nhiều lá thành bao. Sâu non mới nở màu trắng trong, đầu màu nâu sáng, khi bắt đầu ăn cơ thể chuyển màu xanh lá mạ. Sâu non đẫy sức chuyển màu vàng hồng chui ra khỏi bao tìm chỗ hoá nhộng theo cách nhả tơ, cắn đứt hai mép lá khâu thành bao hoặc bò xuống gốc lúa, bẹ lá dệt kén mỏng hoá nhộng.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">- Nhộng: có mầm cánh, râu đầu và chân vượt quá mép sau đốt bụng thứ 4. Lỗ thở trồi lên, các đốt bụng thứ 6, 8 thót vào.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">- Con trưởng thành: có màu vàng nâu, mép trước cánh trước màu nâu đen. Ở khoảng 2/3 kể từ gốc cánh con đực có chấm lõm màu đen óng ánh, trên chấm có chùm lông màu nâu xẫm.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">Đặc điểm sinh học, sinh thái và gây hại:</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">Vòng đời của sâu cuốn lá nhỏ từ 30-35 ngày:</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">+ Thời gian trứng: 6-7 ngày.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">+ Thời gian sâu non: 15-25 ngày.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">+ Thời gian nhộng: 6-8 ngày.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">+ Thời gian ngài vũ hóa đến đẻ trứng: 2-7 ngày.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">Ngài của sâu cuốn lá nhỏ có tính hướng quang rất mạnh và con cái mạnh hơn con đực. Nhộng thường vũ hóa về đêm, ban ngày thường ẩn nấp, nếu khua động thì chỉ bay lên bằng chiều cao ngọn</p><p style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0); text-align: -webkit-center; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho03.jpg\" width=\"77\" height=\"340\"><br>Nhộng</p><p style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0); text-align: -webkit-center; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho01.jpg\" width=\"277\" height=\"265\"><br>Bướm sâu cuốn lá nhỏ</p><p style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0); text-align: -webkit-center; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho04.jpg\" width=\"257\" height=\"370\">&nbsp;&nbsp;&nbsp;<img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho05.jpg\" width=\"71\" height=\"100\"><br>Lá lúa bị sâu cuốn lá nhỏ phá hoại</p><p style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0); text-align: -webkit-center; margin-bottom: 0in;\"><img border=\"0\" src=\"https://vaas.vn/kienthuc/Caylua/img/10_cuonlanho06.jpg\" width=\"327\" height=\"205\"><br>Ruộng lúa bị sâu cuốn lá nhỏ</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">Phòng trừ bằng cách:</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">● Bón cân đối NPK, không nên bón quá nhiều đạm.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">● Điều chỉnh mật độ cấy hợp lý, vệ sinh đồng ruộng và diệt trừ cỏ dại là nơi trú ngụ qua đông.</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">● Dùng các biện pháp thủ công: bẫy đèn bắt bướm…</p><p align=\"justify\" style=\"font-family: Verdana; padding-left: 5px; padding-right: 5px; font-size: 12px; color: rgb(0, 0, 0);\">● Diệt trừ bằng thuốc hoá học: phun các loại thuốc: Padan 95SP, Gegent 800WP, Sumithion 50 EC, Karte 2,EC…</p><div><br></div>"

    "lead": "Mọt đục cành đen Xylosandrus compactus rất nhỏ nhưng có thể làm héo, khô và chết cành. Phát hiện sớm lỗ đục, cắt bỏ cành bị hại và vệ sinh vườn là trọng tâm quản lý.",
    "image": "images/mot-duc-canh-truong-thanh.jpeg",
    "note": "Kiểm tra cành héo bất thường, lỗ tròn rất nhỏ và đường đục trong mô gỗ.",
    "body": "<div class=\"article-summary\"><h2>Tóm tắt bài viết</h2><p><strong>Đối tượng:</strong> Mọt đục cành đen, tên khoa học <em>Xylosandrus compactus</em> (Eichhoff, 1875), là loài có phổ ký chủ rộng trên nhiều cây thân gỗ.</p><p><strong>Dấu hiệu chính:</strong> Lỗ tròn rất nhỏ trên cành, mùn gỗ quanh lỗ, lá phía trên vị trí hại héo nhanh và đường đục bên trong mô gỗ.</p><p><strong>Hướng xử lý:</strong> Thăm vườn thường xuyên, cắt bỏ cành bị hại, đưa ra khỏi vườn để tiêu hủy và chăm sóc cây khỏe. Thuốc bảo vệ thực vật không nên là biện pháp duy nhất khi mọt đã nằm sâu trong gỗ.</p></div>\n<h2>1. Đặc điểm nhận biết mọt đục cành</h2><p>Mọt đục cành thuộc nhóm côn trùng bộ Cánh cứng. Do kích thước rất nhỏ và phần lớn vòng đời sống ẩn trong cành, chúng thường khó phát hiện ở giai đoạn đầu.</p><h3>Trứng, ấu trùng và nhộng</h3><p>Trứng nhỏ, màu trắng, hình bầu dục, khoảng <strong>0,3 × 0,5 mm</strong>, được đẻ thành nhóm trong buồng sinh sản. Ấu trùng màu trắng kem hoặc trắng ngà, đầu nâu nhạt, không có chân và sống trong đường đục. Nhộng màu trắng kem, có hình dạng gần giống mọt trưởng thành.</p><h3>Mọt trưởng thành</h3><p>Mọt cái dài khoảng <strong>1,4–1,9 mm</strong>, thân hình trụ, màu nâu sẫm đến đen. Mọt đực nhỏ hơn, khoảng <strong>0,8–1,1 mm</strong>, không có khả năng bay và thường sống bên trong đường đục.</p><figure class=\"article-figure\"><img src=\"images/mot-duc-canh-truong-thanh.jpeg\" alt=\"Mọt đục cành Xylosandrus compactus trưởng thành\"><figcaption>Mọt đục cành đen <em>Xylosandrus compactus</em> trưởng thành. Nguồn ảnh tham khảo: EPPO Global Database.</figcaption></figure>\n<h2>2. Tập tính sinh sống đặc biệt</h2><p>Mọt cái có mối quan hệ cộng sinh với một số loài nấm. Khi đục vào cành, mọt mang theo bào tử nấm và đưa nấm vào đường hầm. Nấm phát triển trên thành đường đục, trở thành nguồn thức ăn cho mọt trưởng thành và ấu trùng.</p><figure class=\"article-figure\"><img src=\"images/mot-duc-canh-benh.jpeg\" alt=\"Mọt và các pha non trong đường đục bên trong cành\"><figcaption>Mọt trưởng thành và các pha non trong buồng sinh sản nằm sâu bên trong mô gỗ. Nguồn ảnh tham khảo: EPPO Global Database.</figcaption></figure>\n<h2>3. Dấu hiệu nhận biết cây bị mọt đục cành</h2><p>Khi kiểm tra vườn, cần chú ý những dấu hiệu sau:</p><ul><li><strong>Lỗ đục rất nhỏ:</strong> Lỗ tròn khoảng <strong>0,7–0,9 mm</strong>, gần bằng đầu kim, có thể nằm ở mặt dưới hoặc vị trí kín trên cành.</li><li><strong>Mùn gỗ quanh lỗ:</strong> Khi mọt mới xâm nhập, quanh miệng lỗ đôi khi có mùn gỗ hoặc chất thải, nhưng dấu hiệu này không phải lúc nào cũng rõ.</li><li><strong>Cành và lá phía trên bị héo:</strong> Lá mất độ bóng, chuyển vàng hoặc nâu, héo rũ rồi khô dần nhưng vẫn bám trên cành.</li><li><strong>Đường đục bên trong:</strong> Khi chẻ dọc cành có thể thấy đường hầm, mô gỗ nâu hoặc đen, buồng sinh sản cùng mọt trưởng thành, ấu trùng hoặc nhộng.</li></ul><figure class=\"article-figure\"><img src=\"images/mot-duc-canh-lo-duc.jpeg\" alt=\"Lỗ đục nhỏ trên cành do mọt đục cành\"><figcaption>Lỗ xâm nhập của mọt thường rất nhỏ, đôi khi chưa đến 1 mm. Phát hiện khi cành còn xanh giúp xử lý sớm. Nguồn ảnh tham khảo: EPPO Global Database.</figcaption></figure>\n<h2>4. Mọt đục cành gây hại như thế nào?</h2><p>Mọt đục vào bên trong cành để tạo đường hầm và buồng sinh sản, làm tổn thương mô dẫn, ảnh hưởng đến quá trình vận chuyển nước và chất dinh dưỡng. Cành bị hại có thể sinh trưởng kém, héo nhanh, khô chết, dễ gãy khi gặp gió hoặc mang nhiều quả. Vết thương do mọt tạo ra cũng có thể tạo điều kiện cho tác nhân gây bệnh khác xâm nhập.</p><p>Nếu không xử lý sớm, mọt trưởng thành từ cành bị nhiễm có thể tiếp tục phát tán và tấn công cành hoặc cây khác trong vườn.</p>\n<h2>5. Biện pháp phòng trừ mọt đục cành</h2><p>Vì mọt sống sâu trong mô gỗ, khi đường đục đã hoàn chỉnh thì thuốc phun bên ngoài thường khó tiếp xúc trực tiếp với mọt. Do đó, nên áp dụng quản lý dịch hại tổng hợp (IPM), trong đó kiểm tra vườn, cắt bỏ cành bệnh và vệ sinh vườn giữ vai trò trọng tâm.</p><h3>5.1. Thường xuyên kiểm tra vườn</h3><p>Kiểm tra định kỳ cành non, cành nhỏ, cành có lá héo bất thường, cành khô ngọn và các vị trí có lỗ nhỏ trên vỏ. Khi thấy một cành đang xanh bỗng héo nhanh trong khi cành xung quanh vẫn khỏe, cần kiểm tra phần cành phía dưới ngay.</p><h3>5.2. Cắt bỏ cành bị mọt</h3><ol class=\"steps\"><li><b>Xác định vị trí lỗ mọt.</b> Quan sát vùng cành héo hoặc nghi ngờ có đường đục.</li><li><b>Cắt dưới vùng bị hại.</b> Cắt đến phần gỗ còn tươi và khỏe.</li><li><b>Thu gom và tiêu hủy.</b> Đưa toàn bộ cành ra khỏi khu vực sản xuất, không để dưới gốc hoặc ven vườn vì mọt có thể tiếp tục phát triển.</li></ol><h3>5.3. Cắt tỉa và vệ sinh vườn</h3><p>Loại bỏ cành khô, cành sâu bệnh, cành tăm và cành không cần thiết; tạo tán thông thoáng và thu gom tàn dư thực vật bị hại. Vườn thông thoáng cũng giúp dễ quan sát cành mới bị mọt tấn công.</p><h3>5.4. Chăm sóc cây khỏe</h3><p>Tưới nước phù hợp, bón phân cân đối, tăng cường chất hữu cơ, tránh bón quá nhiều đạm, cải thiện đất và bộ rễ, đồng thời hạn chế gây tổn thương không cần thiết cho cây.</p><h3>5.5. Biện pháp sinh học</h3><p>Một số chế phẩm chứa nấm ký sinh côn trùng như <em>Beauveria bassiana</em> và <em>Metarhizium anisopliae</em> có thể hỗ trợ quản lý một số côn trùng gây hại. Hiệu quả phụ thuộc sản phẩm, điều kiện môi trường và phương pháp sử dụng. Chỉ dùng sản phẩm được phép sử dụng, phù hợp với cây trồng và đối tượng phòng trừ theo hướng dẫn trên nhãn.</p><h3>5.6. Sử dụng thuốc bảo vệ thực vật khi cần thiết</h3><p>Không xem thuốc là biện pháp duy nhất, đặc biệt khi mọt đã nằm sâu trong đường đục. Nếu cần sử dụng, phải chọn thuốc được phép dùng tại Việt Nam, đọc kỹ nhãn, không tự ý tăng liều hoặc phối trộn, ưu tiên thời điểm mọt trưởng thành còn hoạt động bên ngoài và tuân thủ nguyên tắc <strong>4 đúng: đúng thuốc, đúng lúc, đúng liều lượng – nồng độ, đúng cách.</strong></p><div class=\"article-summary\"><h3>Lưu ý an toàn</h3><p>Khi pha và phun thuốc, cần mang quần áo bảo hộ, găng tay, kính, khẩu trang phù hợp và ủng; không phun ngược chiều gió, không ăn uống hoặc hút thuốc khi thao tác và phải tuân thủ thời gian cách ly ghi trên nhãn. Không tự ý phối trộn nhiều loại thuốc nếu không có hướng dẫn kỹ thuật.</p></div>\n<h2>6. Cách kiểm tra nhanh ngoài vườn</h2><p><strong>Quan sát lá héo → kiểm tra cành → tìm lỗ mọt → cắt thử cành → chẻ dọc cành → quan sát đường đục và mọt bên trong.</strong> Nếu xác định cành đã bị mọt, cần cắt bỏ và tiêu hủy càng sớm càng tốt.</p><h2>7. Kết luận</h2><p>Mọt đục cành <em>Xylosandrus compactus</em> tuy rất nhỏ nhưng có thể gây chết cành nếu không được phát hiện và xử lý kịp thời. Quy trình ưu tiên là: <strong>thăm vườn thường xuyên → phát hiện sớm → xác định lỗ mọt → cắt bỏ cành bị hại → đưa cành ra khỏi vườn và tiêu hủy → chăm sóc cây khỏe.</strong></p><blockquote><strong>Lời khuyên cho nhà vườn:</strong> Một lỗ nhỏ chưa đến 1 mm đôi khi chính là dấu hiệu đầu tiên của mọt đục cành. Khi cành xanh héo nhanh bất thường, hãy kiểm tra phần cành phía dưới ngay.</blockquote><h2>Nguồn tham khảo</h2><ul><li><a href=\"https://gd.eppo.int/taxon/XYLSCO\" target=\"_blank\" rel=\"noopener\">EPPO Global Database – Xylosandrus compactus</a>.</li><li>University of Florida IFAS Extension và University of Hawaii CTAHR – tài liệu hướng dẫn nhận diện, sinh học và quản lý mọt đục cành.</li></ul>\n"

function cleanBody(){const clone=$('body').cloneNode(true);clone.querySelectorAll('#image-tools').forEach(x=>x.remove());clone.querySelectorAll('.image-edit-frame').forEach(frame=>{const img=frame.querySelector('img');if(img)frame.replaceWith(img);else frame.remove()});return clone.innerHTML.trim()}function dataFromForm(){return {slug:$('slug').value.trim()||slugify($('title').value),title:$('title').value.trim(),type:$('type').value,stage:$('stage').value.trim(),hosts:$('hosts').value.split(',').map(x=>x.trim()).filter(Boolean),lead:$('lead').value.trim(),image:$('image').value.trim()||'images/pest.jpg',note:'',body:cleanBody(),status:$('status').value}}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));}
function badge(status){return `<span class="badge ${status}">${status==='published'?'Đã đăng':status==='draft'?'Chờ đăng':'Đã ẩn'}</span>`}
function render(){const q=$('search').value.toLowerCase().trim(),t=$('filter-type').value,st=$('filter-status').value;const shown=entries.filter(x=>(!q||`${x.slug} ${x.title}`.toLowerCase().includes(q))&&(t==='all'||x.type===t)&&(st==='all'||x.status===st));$('stats').innerHTML=`<span class="stat">Tổng ${entries.length}</span><span class="stat">Đã đăng ${entries.filter(x=>x.status==='published').length}</span><span class="stat">Chờ đăng ${entries.filter(x=>x.status==='draft').length}</span>`;$('list').innerHTML=shown.length?shown.map(x=>`<article class="item ${current===x.slug?'active':''}" data-slug="${x.slug}"><div class="item-top"><div><h3>${x.title||'(Chưa có tiêu đề)'}</h3><small>${x.slug} · ${x.type} · ${(x.hosts||[]).join(', ')}</small></div>${badge(x.status)}</div><div class="item-actions"><button data-edit="${x.slug}">Sửa</button><button data-state="${x.slug}" data-next="${x.status==='published'?'draft':'published'}">${x.status==='published'?'Chờ đăng':'Đăng bài'}</button><button class="delete" data-delete="${x.slug}">Xóa</button></div></article>`).join(''):'<div class="empty">Chưa có bài phù hợp.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>load(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeEntry(b.dataset.delete));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>changeState(b.dataset.state,b.dataset.next));}
function returnImageToolsHome(){$('image-tools-home').appendChild($('image-tools'));$('image-tools').hidden=true;selectedImage=null;selectedFrame=null}function load(slug){const x=entries.find(e=>e.slug===slug);if(!x)return;returnImageToolsHome();current=slug;$('editor-title').textContent='Chỉnh sửa bài viết';['slug','title','stage','lead','image','status','type'].forEach(id=>$(id).value=x[id]??'');$('hosts').value=(x.hosts||[]).join(', ');$('body').innerHTML=x.body||'';$('image-preview').src=x.image||'images/pest.jpg';$('notice').textContent='Đang chỉnh sửa: '+x.title;render();window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){returnImageToolsHome();originalImageWidth=0;originalImageHeight=0;$('form').reset();$('slug').value='';$('title').value='';$('stage').value='Theo dõi đồng ruộng';$('hosts').value='';$('lead').value='';$('image').value='images/pest.jpg';$('body').innerHTML='';$('status').value='draft';$('image-preview').src='images/pest.jpg';$('editor-title').textContent='Tạo bài viết mới';$('notice').textContent='';current=null;render()}
function collect(saveStatus){const x=dataFromForm();if(!x.title||!x.slug){$('notice').textContent='Vui lòng nhập slug và tiêu đề.';return null}x.status=saveStatus||x.status;const i=entries.findIndex(e=>e.slug===x.slug);if(i>=0)entries[i]=x;else entries.unshift(x);current=x.slug;saveLocal();render();return x}
function changeState(slug,status){const x=entries.find(e=>e.slug===slug);if(!x)return;x.status=status;saveLocal();render();if(current===slug)$('status').value=status;$('notice').textContent=status==='published'?'Đã đăng bài.':'Đã chuyển sang chờ đăng.'}
function removeEntry(slug){const x=entries.find(e=>e.slug===slug);if(!x||!confirm(`Xóa bài "${x.title}"?`))return;entries=entries.filter(e=>e.slug!==slug);saveLocal();if(current===slug)resetForm();else render();}
function makeJS(){const live=entries.filter(x=>x.status==='published');return `(function(){\n  const data = {\n${live.map(x=>`    '${esc(x.slug)}': { title:'${esc(x.title)}', type:'${esc(x.type)}', stage:'${esc(x.stage)}', hosts:[${x.hosts.map(h=>`'${esc(h)}'`).join(', ')}], lead:'${esc(x.lead)}', image:'${esc(x.image)}', note:'${esc(x.note||'')}', body:'${esc(x.body)}' },`).join('\n')}\n  };\n  window.PEST_DATA = data;\n  const slug=new URLSearchParams(location.search).get('dichhai');\n  if(!slug||!data[slug])return;\n  const item=data[slug],q=id=>document.getElementById(id);\n  if(q('pest-title'))q('pest-title').textContent=item.title;if(q('pest-lead'))q('pest-lead').textContent=item.lead;if(q('pest-body'))q('pest-body').innerHTML=item.body;document.title=item.title+' | Bảo Vệ Cây Trồng';\n})();\n`}
function updateOutput(){$('output').value=makeJS()}
$('form').onsubmit=e=>{e.preventDefault();if(collect()){$('notice').textContent='Đã cập nhật bài viết trong bộ nhớ quản trị. Hãy tải dich-hai.js để áp dụng cho website.';updateOutput()}};$('publish-btn').onclick=()=>{if(collect('published')){$('notice').textContent='Đã đăng bài và cập nhật danh sách.';updateOutput()}};$('draft-btn').onclick=()=>{if(collect('draft')){$('notice').textContent='Đã lưu nháp, bài chưa hiển thị công khai.';updateOutput()}};$('delete-btn').onclick=()=>{if(current)removeEntry(current);else $('notice').textContent='Hãy chọn một bài để xóa.'};$('reset-btn').onclick=resetForm;$('new-btn').onclick=resetForm;$('search').oninput=render;$('filter-type').onchange=render;$('filter-status').onchange=render;$('backup-btn').onclick=()=>download(JSON.stringify(entries,null,2),'dich-hai-backup.json','application/json');$('download-js').onclick=()=>download(makeJS(),'dich-hai.js','text/javascript');$('download-json').onclick=()=>download(JSON.stringify(entries,null,2),'dich-hai-data.json','application/json');$('copy-js').onclick=async()=>{updateOutput();try{await navigator.clipboard.writeText($('output').value);$('notice').textContent='Đã sao chép mã JavaScript.'}catch{$('output').select();document.execCommand('copy');$('notice').textContent='Đã chọn mã, nhấn Ctrl+C để sao chép.'}};function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}document.querySelectorAll('.toolbar button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{ $('body').focus();if(b.dataset.cmd)document.execCommand(b.dataset.cmd,false,null);if(b.dataset.block)document.execCommand('formatBlock',false,b.dataset.block)}});$('text-color').onchange=e=>{$('body').focus();document.execCommand('foreColor',false,e.target.value);$('body').focus()};$('insert-image-btn').onclick=()=>$('image-insert-file').click();$('image-insert-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{$('body').focus();document.execCommand('insertImage',false,reader.result);$('notice').textContent='Đã chèn ảnh vào nội dung.'};reader.readAsDataURL(f)};let selectedImage=null,selectedFrame=null;let imageRatio=1,originalImageWidth=0,originalImageHeight=0;function selectImage(img){if(!img.closest('.image-edit-frame')){const frame=document.createElement('span');frame.className='image-edit-frame';frame.contentEditable='false';img.parentNode.insertBefore(frame,img);frame.appendChild(img)}selectedImage=img;selectedFrame=img.closest('.image-edit-frame');selectedFrame.appendChild($('image-tools'));$('image-tools').hidden=false;const nativeW=img.naturalWidth||Number(img.dataset.originalWidth)||Number(img.getAttribute('width'))||Math.round(img.getBoundingClientRect().width)||1;const nativeH=img.naturalHeight||Number(img.dataset.originalHeight)||Number(img.getAttribute('height'))||Math.round(img.getBoundingClientRect().height)||1;const w=Number(img.getAttribute('width'))||Math.round(img.getBoundingClientRect().width)||nativeW;const h=Number(img.getAttribute('height'))||Math.round(img.getBoundingClientRect().height)||nativeH;imageRatio=nativeW/nativeH;originalImageWidth=nativeW;originalImageHeight=nativeH;img.dataset.originalWidth=nativeW;img.dataset.originalHeight=nativeH;$('image-width').value=w;$('image-height').value=h}$('body').addEventListener('click',e=>{if(e.target.tagName==='IMG')selectImage(e.target);else if(!e.target.closest('#image-tools')){$('image-tools').hidden=true;selectedImage=null}});function resizeImage(which,value){if(!selectedImage||!value)return;let w=Number($('image-width').value)||0,h=Number($('image-height').value)||0;if($('image-lock').checked){if(which==='width')h=Math.max(10,Math.round(value/imageRatio));else w=Math.max(10,Math.round(value*imageRatio));$('image-width').value=w;$('image-height').value=h}else if(which==='width')w=value;else h=value;selectedImage.style.width=w+'px';selectedImage.style.height=h+'px';selectedImage.setAttribute('width',w);selectedImage.setAttribute('height',h)}$('image-width').oninput=e=>resizeImage('width',e.target.value);$('image-height').oninput=e=>resizeImage('height',e.target.value);document.querySelectorAll('[data-image-align]').forEach(b=>b.onclick=()=>{if(!selectedImage)return;const align=b.dataset.imageAlign;selectedImage.style.display='block';selectedImage.style.marginLeft=align==='center'?'auto':align==='right'?'auto':'0';selectedImage.style.marginRight=align==='center'?'auto':align==='left'?'0':'0';if(align==='right')selectedImage.style.marginLeft='auto';$('body').focus()});$('image-reset-size-btn').onclick=()=>{if(selectedImage&&originalImageWidth&&originalImageHeight){$('image-width').value=originalImageWidth;$('image-height').value=originalImageHeight;selectedImage.style.width=originalImageWidth+'px';selectedImage.style.height=originalImageHeight+'px';selectedImage.setAttribute('width',originalImageWidth);selectedImage.setAttribute('height',originalImageHeight);$('notice').textContent='Đã khôi phục kích thước ban đầu.'}};$('image-delete-btn').onclick=()=>{if(selectedImage){const frame=selectedFrame;selectedImage.remove();if(frame)frame.remove();returnImageToolsHome();$('notice').textContent='Đã xóa ảnh khỏi nội dung.'}};$('font').onchange=e=>{$('body').focus();document.execCommand('fontName',false,e.target.value)};$('image-file').onchange=e=>{const f=e.target.files[0];if(!f)return;coverUrl=URL.createObjectURL(f);$('image-preview').src=coverUrl;$('image').value='images/'+f.name};render();updateOutput();
</script></body></html>
